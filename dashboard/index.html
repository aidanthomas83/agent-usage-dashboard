<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Codex Usage Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell">
    <div class="header">
      <div>
        <h1>Codex usage</h1>
        <p>Local rollout telemetry · token, agent, activity and efficiency analysis</p>
      </div>
      <div class="header-actions">
        <button id="refreshDataBtn" class="primary-btn" type="button">Refresh data</button>
      </div>
    </div>

    <div id="refreshBanner" class="refresh-banner">
      <div class="spinner"></div>
      <span id="refreshBannerText"></span>
    </div>

    <div class="filter-row" aria-label="Dashboard filters">
      <div class="quick-filters" aria-label="Quick date ranges">
        <span class="quick-label">Quick range</span>
        <button class="quick-range" type="button" data-days="7">7 days</button>
        <button class="quick-range" type="button" data-days="30">30 days</button>
        <button class="quick-range" type="button" data-days="60">60 days</button>
        <button class="quick-range" type="button" data-days="90">90 days</button>
        <span id="rangeStatus" class="range-status"></span>
      </div>
      <div class="filters">
        <div class="field"><label>From</label><input id="fromDate" type="date" /></div>
        <div class="field"><label>To</label><input id="toDate" type="date" /></div>
        <div class="field"><label>Model</label><select id="modelFilter"><option value="">All models</option></select></div>
        <div class="field"><label>Agent / role</label><select id="agentFilter"><option value="">All roles</option></select></div>
        <div class="field"><label>Effort</label><select id="effortFilter"><option value="">All efforts</option></select></div>
        <div class="field"><label>Project</label><select id="projectFilter"><option value="">All projects</option></select></div>
        <button id="resetBtn" type="button">Reset</button>
      </div>
    </div>

    <div id="content"></div>
    <div class="footer"><span id="sourceNote"></span><span id="updatedNote"></span></div>
  </div>

  <div id="tooltip" class="tooltip"></div>

  <div id="loadingOverlay" class="loading-overlay" aria-live="polite">
    <div class="loading-card">
      <div class="spinner"></div>
      <div id="loadingTitle" class="loading-title">Loading Codex usage…</div>
      <div id="loadingSub" class="loading-sub">Reading local analytics database</div>
    </div>
  </div>

  <div id="refreshModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="refreshTitle">
    <div class="modal">
      <div class="modal-head">
        <h2 id="refreshTitle">Refresh Codex data</h2>
        <button id="closeRefreshModal" type="button" aria-label="Close">Close</button>
      </div>
      <div class="modal-body">
        <div class="mode-tabs">
          <button class="mode-btn active" data-refresh-mode="days" type="button">Last N days</button>
          <button class="mode-btn" data-refresh-mode="range" type="button">Date range</button>
        </div>

        <div id="refreshDaysPanel" class="refresh-grid">
          <div class="field full">
            <label>Number of days</label>
            <input id="refreshDays" type="number" min="1" max="3650" value="7" />
          </div>
        </div>

        <div id="refreshRangePanel" class="refresh-grid" hidden>
          <div class="field"><label>From</label><input id="refreshFrom" type="date" /></div>
          <div class="field"><label>To</label><input id="refreshTo" type="date" /></div>
        </div>

        <label class="check-row">
          <input id="refreshScanAll" type="checkbox" />
          <span><b>Full rollout scan</b><br />Slower, but useful for historical backfills or after parser changes.</span>
        </label>

        <div id="refreshModalStatus" class="refresh-status" hidden></div>
      </div>
      <div class="modal-footer">
        <button id="cancelRefreshBtn" type="button">Cancel</button>
        <button id="startRefreshBtn" class="primary-btn" type="button">Start refresh</button>
      </div>
    </div>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
