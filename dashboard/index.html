<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Codex Usage Dashboard</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f5f7fa;--panel:#fff;--panel2:#f8fafc;--text:#101418;--muted:#67717e;--line:#dde3ea;
  --blue:#0876db;--orange:#ee8726;--green:#37ae69;--pink:#e85d9e;--purple:#7c5ce5;--teal:#159a8c;
  --amber:#c07d12;--red:#d64f5f;--slate:#5f6b78;--shadow:0 8px 24px rgba(24,35,49,.055);
}
@media(prefers-color-scheme:dark){:root{--bg:#101317;--panel:#171b20;--panel2:#1d2228;--text:#edf2f7;--muted:#a2acb8;--line:#2c333b;--shadow:none}}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.shell{max-width:1480px;margin:0 auto;padding:28px 32px 40px}.header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.header h1{font-size:28px;line-height:1;margin:0 0 8px}.header p{margin:0;color:var(--muted)}
.filter-row{margin:20px 0 16px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.filters{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr)) auto;gap:10px;align-items:end}.field label{display:block;margin:0 0 4px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}.field input,.field select,button{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);padding:0 9px;font:inherit}button{width:auto;cursor:pointer;padding:0 14px;background:var(--panel2)}button:hover{border-color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(9,1fr);gap:10px;margin-bottom:14px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.card{padding:13px 14px;min-height:88px;border-top:3px solid var(--card-accent,var(--blue))}.card .label{color:var(--muted);font-size:11px}.card .value{font-size:22px;font-weight:750;margin:5px 0 2px;letter-spacing:-.02em}.card .sub{color:var(--muted);font-size:10px}.card.warn{--card-accent:var(--amber)}
.section-title{margin:24px 0 10px}.section-title h2{font-size:16px;margin:0 0 2px}.section-title p{margin:0;color:var(--muted);font-size:11px}.panel{padding:14px}.panel h3{font-size:13px;margin:0 0 2px}.panel .desc{color:var(--muted);font-size:10.5px;margin-bottom:12px}.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.grid-2.equal{grid-template-columns:1fr 1fr}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.span-2{grid-column:span 2}.mt{margin-top:14px}
.chart{position:relative;min-height:260px}.chart svg{width:100%;height:auto;display:block;overflow:visible}.axis-label{fill:var(--muted);font-size:10px}.gridline{stroke:var(--line);stroke-width:1}.model-legend,.legend{display:flex;gap:12px 16px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:10px}.legend-item{display:inline-flex;align-items:center;gap:5px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}.tooltip{position:fixed;z-index:50;pointer-events:none;display:none;min-width:190px;max-width:340px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--panel) 97%,transparent);box-shadow:0 10px 28px rgba(0,0,0,.18);font-size:11px;color:var(--text)}.tip-title{font-weight:750;margin-bottom:6px}.tip-row{display:grid;grid-template-columns:10px minmax(90px,1fr) auto;gap:6px;align-items:center;margin:3px 0}.tip-swatch{width:8px;height:8px;border-radius:2px;background:var(--tip-color,var(--muted))}.tip-value{font-variant-numeric:tabular-nums;text-align:right}.tip-divider{height:1px;background:var(--line);margin:6px 0}
.hbars{display:grid;gap:8px}.hrow{display:grid;grid-template-columns:minmax(115px,1.1fr) minmax(90px,1.4fr) auto;gap:8px;align-items:center}.hname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.track{height:8px;background:var(--panel2);border-radius:999px;overflow:hidden}.fill{height:100%;border-radius:999px;background:var(--fill,var(--blue))}.hval{color:var(--muted);font-variant-numeric:tabular-nums;font-size:10px;white-space:nowrap}.model-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--pill-color) 11%,transparent);border:1px solid color-mix(in srgb,var(--pill-color) 35%,var(--line));color:var(--text);font-size:10px}.model-pill:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pill-color)}
.agent-summary{display:flex;flex-wrap:wrap;gap:8px 14px;color:var(--muted);font-size:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.agent-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.agent-pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:10px;background:var(--panel2)}.agent-pill:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--status,var(--muted))}.agent-pill.used{--status:var(--green)}.agent-pill.range{--status:var(--amber)}.agent-pill.never{--status:var(--pink)}
.insight-cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.mini{border:1px solid var(--line);border-radius:9px;padding:11px;background:var(--panel2)}.mini .m-label{font-size:10px;color:var(--muted)}.mini .m-value{font-size:18px;font-weight:720;margin:4px 0 1px}.mini .m-sub{font-size:9.5px;color:var(--muted)}
.table-wrap{overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;min-width:1550px}th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.035em;z-index:2}th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--text);background:var(--panel2)}.sort-arrow{display:inline-block;width:10px;margin-left:2px;color:var(--blue)}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}tbody tr:hover{background:color-mix(in srgb,var(--blue) 4%,transparent)}.empty{padding:52px 20px;text-align:center;color:var(--muted)}
.status-good{color:var(--green)}.status-warn{color:var(--amber)}.status-bad{color:var(--red)}.note{padding:9px 10px;border-radius:8px;background:var(--panel2);color:var(--muted);font-size:10px;border:1px solid var(--line)}.footer{color:var(--muted);font-size:10px;margin-top:14px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(4,1fr)}.insight-cards{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:repeat(3,1fr)}}
@media(max-width:850px){.grid-2,.grid-2.equal,.grid-3,.grid-4{grid-template-columns:1fr}.span-2{grid-column:auto}.filters{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.shell{padding:18px}.insight-cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="shell">
  <div class="header"><div><h1>Codex usage</h1><p>Local rollout telemetry · token, agent, activity and efficiency analysis</p></div></div>
  <div class="filter-row" aria-label="Dashboard filters"><div class="filters">
    <div class="field"><label>From</label><input id="fromDate" type="date"></div>
    <div class="field"><label>To</label><input id="toDate" type="date"></div>
    <div class="field"><label>Model</label><select id="modelFilter"><option value="">All models</option></select></div>
    <div class="field"><label>Agent / role</label><select id="agentFilter"><option value="">All roles</option></select></div>
    <div class="field"><label>Effort</label><select id="effortFilter"><option value="">All efforts</option></select></div>
    <div class="field"><label>Project</label><select id="projectFilter"><option value="">All projects</option></select></div>
    <button id="resetBtn" type="button">Reset</button>
  </div></div>
  <div id="content"></div>
  <div class="footer"><span id="sourceNote"></span><span id="updatedNote"></span></div>
</div>
<div id="tooltip" class="tooltip"></div>
<script src="../data/codex_usage_data.js"></script>
<script>
(()=>{
'use strict';
const bundle=window.CODEX_USAGE_DATA||{metadata:{},records:[],turns:[],activities:[],rate_limits:[],configured_agents:[]};
const rows=Array.isArray(bundle.records)?bundle.records:[], turns=Array.isArray(bundle.turns)?bundle.turns:[], activities=Array.isArray(bundle.activities)?bundle.activities:[], limits=Array.isArray(bundle.rate_limits)?bundle.rate_limits:[], configuredAgents=Array.isArray(bundle.configured_agents)?bundle.configured_agents:[], meta=bundle.metadata||{};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), escAttr=s=>esc(s).replace(/\n/g,'&#10;');
const n=v=>Number(v||0), sum=(rs,k)=>rs.reduce((a,r)=>a+n(r[k]),0), uniq=a=>[...new Set(a.filter(v=>v!==''&&v!=null))].sort((a,b)=>String(a).localeCompare(String(b)));
const fmt=v=>{v=n(v);const a=Math.abs(v);if(a>=1e9)return(v/1e9).toFixed(a>=1e10?1:2)+'B';if(a>=1e6)return(v/1e6).toFixed(a>=1e7?1:2)+'M';if(a>=1e3)return(v/1e3).toFixed(a>=1e4?1:2)+'K';return Math.round(v).toLocaleString()};
const fmtExact=v=>n(v).toLocaleString(undefined,{maximumFractionDigits:0}), fmtCredits=v=>n(v).toLocaleString(undefined,{minimumFractionDigits:n(v)<10?2:1,maximumFractionDigits:n(v)<10?2:1}), fmtUsd=v=>n(v).toLocaleString('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2}), pct=v=>`${n(v).toFixed(1)}%`, fmtMs=v=>{v=n(v);if(!v)return'—';if(v>=60000)return`${(v/60000).toFixed(1)}m`;if(v>=1000)return`${(v/1000).toFixed(1)}s`;return`${Math.round(v)}ms`};
function percentile(vals,p){const a=vals.map(n).filter(v=>v>0).sort((x,y)=>x-y);if(!a.length)return 0;const i=(a.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i);return lo===hi?a[lo]:a[lo]+(a[hi]-a[lo])*(i-lo)}
function hash(s){let h=2166136261;for(const c of String(s||'')){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const MODEL_COLORS={
  'gpt-5.6-luna':'#0876db','gpt-5.6-sol':'#ee8726','gpt-5.6-terra':'#37ae69','codex-auto-review':'#e85d9e','gpt-6-astra':'#7c5ce5','gpt-6-sol':'#3c8fd6','gpt-6-luna':'#4d9a9a','gpt-5.5':'#159a8c','gpt-5.4':'#c07d12','gpt-5.3-codex':'#d64f5f'
};
const COLOR_POOL=['#0876db','#ee8726','#37ae69','#e85d9e','#7c5ce5','#159a8c','#c07d12','#d64f5f','#3c8fd6','#8e6c4c','#4d9a9a','#a661c2'];
function modelColor(name){const k=String(name||'Unknown').toLowerCase();return MODEL_COLORS[k]||COLOR_POOL[hash('model:'+k)%COLOR_POOL.length]}
const AGENT_COLORS={'Main':'#5f6b78','executor':'#0876db','guardian_review':'#7c5ce5','reviewer':'#e85d9e','planner':'#ee8726','researcher':'#37ae69','security_review':'#d64f5f'};
function agentColor(name){const k=String(name||'Subagent');return AGENT_COLORS[k]||COLOR_POOL[hash('agent:'+k)%COLOR_POOL.length]}
function roleLabel(r){if((r.agent_type||'')==='Main')return'Main';return String(r.agent_role||r.agent_label||r.thread_source||'Subagent').split(' · ')[0]||'Subagent'}
const roleKey=v=>String(v||'').trim().toLowerCase();
function fmtDate(v,time=false){if(!v)return'—';const d=new Date(v);if(Number.isNaN(d.getTime()))return String(v).slice(0,time?16:10);return new Intl.DateTimeFormat('en-AU',time?{day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}:{day:'2-digit',month:'short',year:'2-digit'}).format(d)}
function axisDate(v){const [y,m,d]=String(v||'').split('-').map(Number),mons=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];return d&&m?`${String(d).padStart(2,'0')}-${mons[m-1]}`:String(v||'')}
function setOptions(id,vals,label){$(id).innerHTML=`<option value="">${esc(label)}</option>`+vals.filter(v=>String(v||'').trim()).map(v=>`<option value="${escAttr(v)}">${esc(v)}</option>`).join('')}
function initFilters(){if(!rows.length)return;const dates=uniq(rows.map(r=>r.date)).sort();$('fromDate').value=dates[0];$('toDate').value=dates.at(-1);setOptions('modelFilter',uniq(rows.map(r=>r.model)).sort(),'All models');setOptions('agentFilter',uniq(rows.map(roleLabel)).sort(),'All roles');setOptions('effortFilter',uniq(rows.map(r=>r.reasoning_effort)).sort(),'All efforts');setOptions('projectFilter',uniq(rows.map(r=>r.project)).sort(),'All projects')}
function filterState(){return{from:$('fromDate').value,to:$('toDate').value,model:$('modelFilter').value,agent:$('agentFilter').value,effort:$('effortFilter').value,project:$('projectFilter').value}}
function matches(r,state=filterState()){return(!state.from||String(r.date||'')>=state.from)&&(!state.to||String(r.date||'')<=state.to)&&(!state.model||String(r.model||'')===state.model)&&(!state.agent||roleKey(roleLabel(r))===roleKey(state.agent))&&(!state.effort||String(r.reasoning_effort||'')===state.effort)&&(!state.project||String(r.project||'')===state.project)}
function filteredRows(state=filterState()){return rows.filter(r=>matches(r,state))} function filteredTurns(state=filterState()){return turns.filter(r=>matches(r,state))} function filteredActivities(state=filterState()){return activities.filter(r=>matches(r,state))}
function group(rs,key,val='total_tokens'){const m=new Map();rs.forEach(r=>{const k=typeof key==='function'?key(r):(r[key]||'Unknown');m.set(k,(m.get(k)||0)+n(r[val]))});return[...m.entries()].sort((a,b)=>b[1]-a[1])}
function groupCount(rs,key){const m=new Map();rs.forEach(r=>{const k=typeof key==='function'?key(r):(r[key]||'Unknown');m.set(k,(m.get(k)||0)+1)});return[...m.entries()].sort((a,b)=>b[1]-a[1])}
function kpi(label,value,sub='',accent='var(--blue)',warn=false){return`<div class="card${warn?' warn':''}" style="--card-accent:${accent}"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div>${sub?`<div class="sub">${esc(sub)}</div>`:''}</div>`}
function tipJson(title,items){return escAttr(JSON.stringify({title,items}))}
function hbars(entries,total,colorFn,maxRows=10,valueFmt=fmt){if(!entries.length)return'<div class="empty">No data for this selection.</div>';const shown=entries.slice(0,maxRows),mx=Math.max(...shown.map(x=>x[1]),1);return`<div class="hbars">${shown.map(([name,val])=>{const color=colorFn(name),share=total?pct(val/total*100):'';return`<div class="hrow" data-tip-json="${tipJson(name,[{label:'Value',value:valueFmt(val),color},{label:'Share',value:share,color}].filter(x=>x.value))}"><div class="hname" title="${esc(name)}">${esc(name)}</div><div class="track"><div class="fill" style="--fill:${color};width:${Math.max(1,val/mx*100)}%"></div></div><div class="hval">${valueFmt(val)}${total?` · ${share}`:''}</div></div>`}).join('')}</div>`}
function legend(names,colorFn){return`<div class="model-legend">${names.map(x=>`<span class="legend-item"><span class="dot" style="background:${colorFn(x)}"></span>${esc(x)}</span>`).join('')}</div>`}
function svgYTicks(max,count=4){const out=[];for(let i=0;i<=count;i++)out.push(max*i/count);return out}
function dailyModelBars(rs,valueKey='total_tokens',mode='tokens'){const credits=mode===true||mode==='credits',usd=mode==='usd';
  const byDay=new Map(), models=uniq(rs.map(r=>r.model||'Unknown'));
  rs.forEach(r=>{const d=r.date,g=byDay.get(d)||{models:new Map(),cached:0,fresh:0,output:0,total:0};const m=r.model||'Unknown';g.models.set(m,(g.models.get(m)||0)+n(r[valueKey]));g.cached+=n(r.cached_input_tokens);g.fresh+=n(r.fresh_input_tokens);g.output+=n(r.output_tokens);g.total+=n(r[valueKey]);byDay.set(d,g)});
  const data=[...byDay.entries()].sort((a,b)=>a[0].localeCompare(b[0]));if(!data.length)return'<div class="empty">No data for this selection.</div>';
  const W=940,H=270,L=58,R=10,T=10,B=40,pw=W-L-R,ph=H-T-B,max=Math.max(...data.map(x=>x[1].total),1),step=pw/data.length,bw=Math.min(58,step*.68),ticks=svgYTicks(max);
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  ticks.forEach(v=>{const y=T+ph-v/max*ph;svg+=`<line class="gridline" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="axis-label" x="${L-8}" y="${y+3}" text-anchor="end">${usd?fmtUsd(v):(credits?fmtCredits(v):fmt(v))}</text>`});
  data.forEach(([d,g],i)=>{const x=L+i*step+(step-bw)/2;let y=T+ph;const modelEntries=[...g.models.entries()].sort((a,b)=>b[1]-a[1]);modelEntries.forEach(([m,v])=>{const h=v/max*ph;y-=h;svg+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,.6)}" fill="${modelColor(m)}" rx="1"/>`});
    const items=usd?[{label:'API-equivalent cost',value:fmtUsd(g.total),color:'var(--green)'},...modelEntries.map(([m,v])=>({label:m,value:fmtUsd(v),color:modelColor(m)}))]:credits?[{label:'Estimated credits',value:fmtCredits(g.total),color:'var(--purple)'},...modelEntries.map(([m,v])=>({label:m,value:fmtCredits(v),color:modelColor(m)}))]:[{label:'Total',value:fmtExact(g.total),color:'#5f6b78'},{label:'Cached input',value:fmtExact(g.cached),color:'#159a8c'},{label:'Fresh input',value:fmtExact(g.fresh),color:'#ee8726'},{label:'Output',value:fmtExact(g.output),color:'#e85d9e'},...modelEntries.map(([m,v])=>({label:m,value:fmtExact(v),color:modelColor(m)}))];
    svg+=`<rect x="${L+i*step}" y="${T}" width="${step}" height="${ph}" fill="transparent" data-tip-json="${tipJson(axisDate(d),items)}"/><text class="axis-label" x="${L+i*step+step/2}" y="${H-14}" text-anchor="middle">${axisDate(d)}</text>`;
  });
  svg+='</svg>';return svg+legend(models,modelColor)
}
function lineChart(rs,keyFn,valueFn,colorFn,maxSeries=5,valueFmt=fmtExact){
  const dates=uniq(rs.map(r=>r.date)).sort(), seriesMap=new Map();rs.forEach(r=>{const k=keyFn(r)||'Unknown',d=r.date;if(!seriesMap.has(k))seriesMap.set(k,new Map());seriesMap.get(k).set(d,(seriesMap.get(k).get(d)||0)+valueFn(r))});
  let series=[...seriesMap.entries()].map(([k,m])=>[k,m,[...m.values()].reduce((a,b)=>a+b,0)]).sort((a,b)=>b[2]-a[2]);if(series.length>maxSeries){const top=series.slice(0,maxSeries-1),rest=series.slice(maxSeries-1),other=new Map();rest.forEach(([,m])=>m.forEach((v,d)=>other.set(d,(other.get(d)||0)+v)));series=[...top,['Other',other,[...other.values()].reduce((a,b)=>a+b,0)]]}
  if(!dates.length||!series.length)return'<div class="empty">No data for this selection.</div>';
  const W=760,H=245,L=52,R=14,T=14,B=34,pw=W-L-R,ph=H-T-B,max=Math.max(...series.flatMap(([,m])=>dates.map(d=>m.get(d)||0)),1),ticks=svgYTicks(max),x=(d,i)=>dates.length===1?L+pw/2:L+i*pw/(dates.length-1),y=v=>T+ph-v/max*ph;
  let svg=`<svg viewBox="0 0 ${W} ${H}">`;ticks.forEach(v=>{svg+=`<line class="gridline" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis-label" x="${L-7}" y="${y(v)+3}" text-anchor="end">${fmt(v)}</text>`});
  series.forEach(([name,m])=>{const pts=dates.map((d,i)=>`${x(d,i)},${y(m.get(d)||0)}`).join(' ');svg+=`<polyline points="${pts}" fill="none" stroke="${colorFn(name)}" stroke-width="2" vector-effect="non-scaling-stroke"/>`;dates.forEach((d,i)=>{const v=m.get(d)||0;svg+=`<circle cx="${x(d,i)}" cy="${y(v)}" r="2.8" fill="${colorFn(name)}"/>`})});
  dates.forEach((d,i)=>{const left=dates.length===1?L:L+(i===0?0:(i-.5)*pw/(dates.length-1)),right=dates.length===1?W-R:L+(i===dates.length-1?dates.length-1:(i+.5))*pw/(dates.length-1),items=series.map(([name,m])=>({label:name,value:valueFmt(m.get(d)||0),color:colorFn(name)}));svg+=`<rect x="${left}" y="${T}" width="${Math.max(1,right-left)}" height="${ph}" fill="transparent" data-tip-json="${tipJson(axisDate(d),items)}"/>`;if(dates.length<=9||i===0||i===dates.length-1||i%Math.ceil(dates.length/7)===0)svg+=`<text class="axis-label" x="${x(d,i)}" y="${H-10}" text-anchor="middle">${axisDate(d)}</text>`});svg+='</svg>';return svg+legend(series.map(s=>s[0]),colorFn)
}
