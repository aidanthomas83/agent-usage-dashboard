name: Repository safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sensitive-data-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile collect_codex_usage.py scripts/check_repo_safety.py
      - name: Check collector CLI
        run: python collect_codex_usage.py --help > /dev/null
      - name: Smoke-test collector
        run: |
          mkdir -p /tmp/codex-empty
          python collect_codex_usage.py --days 1 --codex-home /tmp/codex-empty --output-dir /tmp/codex-usage-smoke
      - name: Test legacy token-count telemetry
        run: python scripts/check_legacy_token_count.py
      - name: Check dashboard JavaScript syntax
        run: node scripts/check_dashboard_js.mjs
      - name: Check tracked files for local telemetry and credentials
        run: python scripts/check_repo_safety.py

  windows-runner-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Windows runner argument forms
        shell: pwsh
        run: |
          $codexHome = Join-Path $env:RUNNER_TEMP "codex-empty"
          $outDir = Join-Path $env:RUNNER_TEMP "usage-out"
          New-Item -ItemType Directory -Force -Path $codexHome | Out-Null
          $env:CODEX_USAGE_NO_OPEN = "1"

          .\run-usage-report.cmd --days 1 --codex-home "$codexHome" --output-dir "$outDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          .\run-usage-report.cmd 1 --codex-home "$codexHome" --output-dir "$outDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
