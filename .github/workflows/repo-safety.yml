name: Repository safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sensitive-data-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile collect_codex_usage.py collect_paperclip_usage.py usage_model.py server.py scripts/check_repo_safety.py scripts/check_paperclip_usage.py
      - name: Check collector CLIs
        run: |
          python collect_codex_usage.py --help > /dev/null
          python collect_paperclip_usage.py --help > /dev/null
      - name: Smoke-test collector
        run: |
          mkdir -p /tmp/codex-empty
          python collect_codex_usage.py --days 1 --codex-home /tmp/codex-empty --output-dir /tmp/codex-usage-smoke
      - name: Test legacy token-count telemetry
        run: python scripts/check_legacy_token_count.py
      - name: Test Codex skill activity detection
        run: python scripts/check_skill_activity.py
      - name: Test Paperclip usage normalization
        run: python scripts/check_paperclip_usage.py
      - name: Test tab-specific SQLite queries
        run: python scripts/check_server_queries.py
      - name: Smoke-test local API server
        run: |
          python server.py --host 127.0.0.1 --port 8765 --data-dir /tmp/codex-usage-smoke --codex-home /tmp/codex-empty > /tmp/codex-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          python - <<'PY'
          import json, time, urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8765/health", timeout=1) as r:
                      assert json.load(r)["ok"] is True
                  break
              except Exception:
                  time.sleep(.2)
          else:
              raise SystemExit("server did not become healthy")
          with urllib.request.urlopen("http://127.0.0.1:8765/api/meta", timeout=2) as r:
              payload=json.load(r)
              assert "ready" in payload
          with urllib.request.urlopen("http://127.0.0.1:8765/api/dashboard", timeout=2) as r:
              payload=json.load(r)
              assert "ready" in payload
          PY
      - name: Check dashboard JavaScript syntax
        run: node scripts/check_dashboard_js.mjs
      - name: Build Docker image
        run: docker build -t agent-usage-dashboard:test .
      - name: Check tracked files for local telemetry and credentials
        run: python scripts/check_repo_safety.py

  windows-runner-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Windows runner argument forms
        shell: pwsh
        run: |
          $codexHome = Join-Path $env:RUNNER_TEMP "codex-empty"
          $outDir = Join-Path $env:RUNNER_TEMP "usage-out"
          New-Item -ItemType Directory -Force -Path $codexHome | Out-Null
          $env:CODEX_USAGE_NO_OPEN = "1"

          .\run-usage-report.cmd --days 1 --codex-home "$codexHome" --output-dir "$outDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          .\run-usage-report.cmd 1 --codex-home "$codexHome" --output-dir "$outDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
